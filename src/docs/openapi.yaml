openapi: 3.0.3
info:
  title: E-commerce REST API
  version: 1.0.0
  description: |
    Node.js / Express / MongoDB API with JWT auth, roles (admin, customer), multi-level categories,
    products and orders. Click **Authorize** and paste the JWT returned by `/auth/login`.
servers:
  - url: http://localhost:3000/api/v1
tags:
  - { name: Auth }
  - { name: Users }
  - { name: Categories }
  - { name: Products }
  - { name: Orders }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, example: 65f1c0a1b2c3d4e5f6a7b8c9 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
  responses:
    ValidationError:
      description: Validation failed (400)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing / invalid token (401)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Insufficient role or deactivated account (403)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found (404)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflict, e.g. duplicate value, insufficient stock, invalid status transition (409)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        errors:
          type: array
          items: { type: object, properties: { location: { type: string }, field: { type: string }, message: { type: string } } }
    Pagination:
      type: object
      properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer }, totalPages: { type: integer } }
    User:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, customer] }
        isActive: { type: boolean }
        phone: { type: string }
    Category:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        parent: { type: string, nullable: true }
        ancestors: { type: array, items: { type: string } }
        isActive: { type: boolean }
    CategoryNode:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          properties:
            children: { type: array, items: { $ref: '#/components/schemas/CategoryNode' } }
    Product:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        sku: { type: string }
        description: { type: string }
        price: { type: number }
        salePrice: { type: number, nullable: true }
        effectivePrice: { type: number }
        stock: { type: integer }
        category: { type: string }
        status: { type: string, enum: [active, inactive] }
    ProductInput:
      type: object
      required: [name, sku, price, stock, category]
      properties:
        name: { type: string, example: Galaxy S24 }
        sku: { type: string, example: SAM-S24-128 }
        description: { type: string }
        price: { type: number, example: 79999 }
        salePrice: { type: number, example: 74999 }
        stock: { type: integer, example: 50 }
        category: { type: string }
        status: { type: string, enum: [active, inactive] }
    Address:
      type: object
      required: [fullName, phone, line1, city, state, postalCode, country]
      properties:
        fullName: { type: string }
        phone: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }
    OrderInput:
      type: object
      required: [items, shippingAddress]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties: { productId: { type: string }, quantity: { type: integer, minimum: 1 } }
        shippingAddress: { $ref: '#/components/schemas/Address' }
    Order:
      type: object
      properties:
        _id: { type: string }
        orderNumber: { type: string }
        user: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              product: { type: string }
              name: { type: string }
              sku: { type: string }
              unitPrice: { type: number }
              quantity: { type: integer }
              subtotal: { type: number }
        totalAmount: { type: number }
        status: { type: string, enum: [Pending, Confirmed, Processing, Shipped, Delivered, Cancelled] }
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Jane Doe }
                email: { type: string, example: jane@example.com }
                password: { type: string, example: Passw0rd123, description: 'Min 8 chars, at least one letter and one number' }
                phone: { type: string }
      responses:
        '201': { description: Registered; returns user + JWT }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: { type: string }, password: { type: string } }
      responses:
        '200': { description: Returns user + JWT }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/me:
    get:
      tags: [Users]
      summary: Get own profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      summary: Update own profile (name, phone, address)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string }, phone: { type: string }, address: { type: object } } } } }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/ValidationError' }
  /users/me/password:
    patch:
      tags: [Users]
      summary: Change own password (returns a fresh JWT)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string }, newPassword: { type: string } } } } }
      responses:
        '200': { description: Changed }
        '400': { $ref: '#/components/responses/ValidationError' }
  /users:
    get:
      tags: [Users]
      summary: "[Admin] List users"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string, enum: [admin, customer] } }
        - { name: isActive, in: query, schema: { type: boolean } }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{id}:
    get:
      tags: [Users]
      summary: "[Admin] Get a user"
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/status:
    patch:
      tags: [Users]
      summary: "[Admin] Activate / deactivate a user"
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [isActive], properties: { isActive: { type: boolean } } } } }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
  /categories/tree:
    get:
      tags: [Categories]
      summary: Full nested category hierarchy (active categories, public)
      responses:
        '200':
          description: Tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/CategoryNode' } }
  /categories:
    get:
      tags: [Categories]
      summary: "[Admin] List categories (flat)"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: search, in: query, schema: { type: string } }
        - { name: parent, in: query, description: 'Parent id, or "null" for root categories', schema: { type: string } }
        - { name: isActive, in: query, schema: { type: boolean } }
      responses:
        '200': { description: OK }
    post:
      tags: [Categories]
      summary: "[Admin] Create a category (omit/null parent for a root category)"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, example: Mobiles }, description: { type: string }, parent: { type: string, nullable: true }, isActive: { type: boolean } }
      responses:
        '201': { description: Created }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /categories/{id}:
    get:
      tags: [Categories]
      summary: "[Admin] Get a category with breadcrumb (ancestors) and direct children"
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Categories]
      summary: "[Admin] Update / move a category. Rejects self-parenting and circular moves (400)"
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string }, description: { type: string }, parent: { type: string, nullable: true }, isActive: { type: boolean } } } } }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Categories]
      summary: "[Admin] Delete a category (409 if it has children or products)"
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Conflict' }
  /products:
    get:
      tags: [Products]
      summary: Customer product listing (active products, public)
      description: Filtering by a parent category also returns products from all its sub-categories.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: search, in: query, description: 'Matches name, SKU or description', schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, oldest, price_asc, price_desc, name_asc, name_desc], default: newest } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Products]
      summary: "[Admin] Create a product"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/admin/list:
    get:
      tags: [Products]
      summary: "[Admin] List all products (any status)"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: sort, in: query, schema: { type: string } }
      responses:
        '200': { description: OK }
  /products/admin/{id}:
    get:
      tags: [Products]
      summary: "[Admin] Get a product (any status)"
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{id}:
    get:
      tags: [Products]
      summary: Get an active product (public)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      summary: "[Admin] Update a product"
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Products]
      summary: "[Admin] Delete a product"
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders:
    post:
      tags: [Orders]
      summary: "[Customer] Place an order. Prices/totals computed server-side; stock decremented atomically"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrderInput' } } }
      responses:
        '201': { description: Order placed, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Orders]
      summary: List orders (customer => own only; admin => all)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: status, in: query, schema: { type: string } }
        - { name: user, in: query, description: Admin only, schema: { type: string } }
      responses:
        '200': { description: OK }
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order (customers can only access their own; others get 404)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/cancel:
    patch:
      tags: [Orders]
      summary: "[Customer] Cancel own order (Pending only); stock is restored"
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Cancelled }
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: "[Admin] Update status. Pending→Confirmed→Processing→Shipped→Delivered; Cancelled allowed until Shipped (restores stock)"
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [Pending, Confirmed, Processing, Shipped, Delivered, Cancelled] } }
      responses:
        '200': { description: Updated }
        '409': { $ref: '#/components/responses/Conflict' }
