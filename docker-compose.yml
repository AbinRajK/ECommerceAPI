services:
  mongo:
    image: mongo:7
    # Single-node replica set => multi-document transactions work
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    build: .
    ports: ["3000:3000"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/ecommerce?replicaSet=rs0
      USE_TRANSACTIONS: "true"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-your-shell-or-.env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}

volumes:
  mongo-data:
